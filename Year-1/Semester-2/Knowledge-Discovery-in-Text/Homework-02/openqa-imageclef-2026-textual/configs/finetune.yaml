base_model: Qwen/Qwen2.5-7B-Instruct
output_dir: experiments/runs/qwen25_lora

data:
  train_path: data/processed/train_sft_ocr.jsonl
  clean_train_path: data/processed/train_sft_clean_upper_bound.jsonl

qlora:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16

lora:
  r: 16
  alpha: 32
  dropout: 0.05

training:
  learning_rate: 0.0002
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  max_seq_length: 1024
