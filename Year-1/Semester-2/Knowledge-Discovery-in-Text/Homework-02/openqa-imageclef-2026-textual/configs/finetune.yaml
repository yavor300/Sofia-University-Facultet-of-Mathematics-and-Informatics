base_model: Qwen/Qwen2.5-7B-Instruct
# Other tested candidates:
# - Qwen/Qwen2.5-14B-Instruct
# - mistralai/Mistral-7B-Instruct-v0.3
output_dir: experiments/runs/qwen25_lora
model_dtype: auto

data:
  train_path: data/processed/train_sft_ocr.jsonl
  clean_train_path: data/processed/train_sft_clean_upper_bound.jsonl

qlora:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: false

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  learning_rate: 0.0002
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  max_seq_length: 1024
  logging_steps: 5
  save_strategy: epoch
  bf16: true
  fp16: false
  optim: paged_adamw_8bit
  report_to: none
